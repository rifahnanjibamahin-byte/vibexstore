<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE-X STUDIO BD | Private Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #7d5fff;
            --secondary: #22d3ee;
            --bg: #0b0e14;
            --card-bg: #161b22;
            --accent: #22c55e;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        /* লগইন বক্স */
        #login-container {
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 25px;
            border: 1px solid #30363d;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            width: 85%;
            max-width: 350px;
            animation: fadeIn 0.5s ease;
        }

        .logo-img { width: 100px; height: auto; margin-bottom: 10px; }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--primary); font-size: 22px; margin-bottom: 20px; letter-spacing: 2px; }

        input {
            width: 80%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: white;
            text-align: center;
            font-size: 16px;
        }

        .login-btn {
            background: linear-gradient(45deg, var(--primary), #a29bfe);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            width: 90%;
        }

        /* ড্যাশবোর্ড (লগইন করার পর আসবে) */
        #dashboard {
            display: none;
            width: 100%;
            padding: 20px;
            animation: fadeIn 0.8s ease;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            max-width: 350px;
            margin: 0 auto;
            border: 1px solid #30363d;
        }

        .product-img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
            background: #21262d;
        }

        .price { font-size: 26px; color: var(--secondary); font-weight: bold; margin: 10px 0; }

        .wa-btn {
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            display: block;
            font-weight: bold;
            font-size: 18px;
            margin-top: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="login-container">
        <img src="logo.png" alt="Logo" class="logo-img">
        <h1>VIBE-X STUDIO</h1>
        <input type="password" id="passkey" placeholder="Enter Passkey">
        <button class="login-btn" onclick="checkAuth()">LOGIN</button>
        <p id="err" style="color: #ff4d4d; font-size: 14px; margin-top: 10px; display: none;">ভুল পাসওয়ার্ড!</p>
    </div>

    <div id="dashboard">
        <img src="logo.png" alt="Logo" style="width: 70px; margin-bottom: 10px;">
        <h2 style="font-family: 'Orbitron'; color: var(--primary);">OFFICIAL STORE</h2>
        
        <div class="product-card">
            <img src="product.jpg" alt="Aura Collection" class="product-img">
            <h3 style="margin: 5px 0;">AURA EDITION - STREETWEAR</h3>
            <div class="price">৳১২০০</div>
            <a href="https://wa.me/8801830891270?text=Hi Mahin, I want to order the Aura Edition T-shirt." class="wa-btn">
                ORDER ON WHATSAPP
            </a>
        </div>

        <button onclick="location.reload()" style="background:none; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 8px 15px; border-radius: 8px; margin-top: 30px; cursor: pointer;">LOGOUT</button>
    </div>

    <script>
        function checkAuth() {
            const input = document.getElementById("passkey").value;
            // পাসওয়ার্ড এখানে চেক হচ্ছে
            if (input === "vibe26") {
                document.getElementById("login-container").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
                document.body.style.alignItems = "flex-start";
                document.body.style.paddingTop = "40px";
            } else {
                document.getElementById("err").style.display = "block";
            }
        }
    </script>
</body>
</html>
