<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe-X | Elevate Your Aura</title>
    <style>
        :root {
            --bg: #0F172A; --card: #1E293B; --primary: #8B5CF6; --accent: #06B6D4; --text: #F8FAFC;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; text-align: center; }
        
        /* ড্যাশবোর্ড ওভারলে */
        #admin-panel {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98); z-index: 9999; overflow-y: auto; padding: 40px 0;
        }

        .admin-form {
            background: #020617; padding: 25px; border: 1px solid var(--primary);
            width: 85%; max-width: 350px; margin: 0 auto; border-radius: 20px;
        }

        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #1E293B; color: white; outline: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }

        /* ওয়েবসাইট মেইন সেকশন */
        nav { padding: 20px; border-bottom: 1px solid #1E293B; background: #0F172A; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); letter-spacing: 2px; }
        .hero { padding: 50px 20px; background: linear-gradient(to bottom, #1e1b4b, var(--bg)); }
        .container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 20px; }
        .product-card { background: var(--card); padding: 20px; border-radius: 25px; width: 280px; border: 1px solid #334155; }
        .product-card img { width: 100%; border-radius: 15px; height: 300px; object-fit: cover; background: #0F172A; }
        .price { color: var(--accent); font-size: 26px; font-weight: bold; margin: 15px 0; }
        .buy-btn { display: block; background: #25D366; color: white; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold; }
        
        footer { margin-top: 50px; padding: 40px; font-size: 11px; color: #475569; }
        #secret-lock { cursor: pointer; display: block; margin-top: 20px; opacity: 0.3; }
    </style>
</head>
<body>

    <div id="admin-panel">
        <div class="admin-form">
            <h3 style="color:var(--primary); margin-top:0;">Admin Login</h3>
            <div id="login-fields">
                <input type="password" id="pass-input" placeholder="পাসওয়ার্ড দিন">
                <button class="btn" onclick="checkAuth()">Login</button>
            </div>
            
            <div id="edit-fields" style="display:none;">
                <h4 style="margin: 10px 0;">Edit Product</h4>
                <input type="text" id="n-name" placeholder="প্রোডাক্টের নাম">
                <input type="text" id="n-price" placeholder="দাম (যেমন: ৯৫০)">
                <input type="text" id="n-size" placeholder="সাইজ (যেমন: M, L, XL)">
                <input type="file" id="n-img" accept="image/*" style="border:none;">
                <button class="btn" onclick="saveData()">Update Site</button>
            </div>
            
            <button class="btn" style="background:#475569; margin-top:20px;" onclick="closeAdmin()">Cancel / Close</button>
        </div>
    </div>

    <nav><div class="logo">VIBE-X</div></nav>

    <div class="hero">
        <h1 style="margin:0; font-size:32px;">ELEVATE YOUR AURA</h1>
        <p style="color:var(--accent);">Premium Streetwear Drop 2026</p>
    </div>

    <div class="container">
        <div class="product-card">
            <img id="p-img" src="https://via.placeholder.com/300x400/1E293B/8B5CF6?text=Vibe-X+Logo" alt="Product">
            <h3 id="p-name">Aura Collection</h3>
            <p id="p-size" style="color: #94A3B8;">Size: Not Selected</p>
            <p class="price">৳<span id="p-price">000</span></p>
            <a href="#" id="wa-link" class="buy-btn">Order on WhatsApp</a>
        </div>
    </div>

    <footer>
        <p>© 2026 VIBE-X STUDIO BD | STREETWEAR CULTURE</p>
        <span id="secret-lock" onclick="openAdmin()">🔒 Admin Access</span>
    </footer>

    <script>
        function openAdmin() { 
            document.getElementById('admin-panel').style.display = 'block'; 
            document.getElementById('login-fields').style.display = 'block';
            document.getElementById('edit-fields').style.display = 'none';
        }
        
        function closeAdmin() { 
            document.getElementById('admin-panel').style.display = 'none'; 
            document.getElementById('pass-input').value = "";
        }

        function checkAuth() {
            if(document.getElementById('pass-input').value === "2026") {
                document.getElementById('login-fields').style.display = 'none';
                document.getElementById('edit-fields').style.display = 'block';
            } else {
                alert("ভুল পাসওয়ার্ড!");
            }
        }

        function saveData() {
            const name = document.getElementById('n-name').value;
            const price = document.getElementById('n-price').value;
            const size = document.getElementById('n-size').value;
            const file = document.getElementById('n-img').files[0];

            if(name) document.getElementById('p-name').innerText = name;
            if(price) document.getElementById('p-price').innerText = price;
            if(size) document.getElementById('p-size').innerText = "Size: " + size;

            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) { document.getElementById('p-img').src = e.target.result; }
                reader.readAsDataURL(file);
            }

            const waText = `Vibe-X Order Request!\nItem: ${name}\nSize: ${size}\nPrice: ৳${price}`;
            document.getElementById('wa-link').href = `https://wa.me/8801830891270?text=${encodeURIComponent(waText)}`;
            
            alert("সফলভাবে আপডেট হয়েছে!");
            closeAdmin();
        }
    </script>
</body>
</html>
