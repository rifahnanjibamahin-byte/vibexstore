<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE-X STUDIO BD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #7d5fff; --bg: #0b1016; --card-bg: #161b22; }
        body { background-color: var(--bg); color: white; font-family: 'Rajdhani', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 30px 10px; }
        
        /* কাস্টমার ভিউ */
        .header { text-align: center; margin-bottom: 20px; }
        .logo-img { width: 100px; height: auto; }
        .product-card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 20px; padding: 20px; max-width: 350px; text-align: center; }
        .product-img { width: 100%; border-radius: 15px; margin-bottom: 15px; }
        .price { font-size: 28px; color: #22d3ee; font-weight: bold; }
        .order-btn { background: #22c55e; color: white; text-decoration: none; padding: 15px; border-radius: 12px; display: block; font-weight: bold; margin-top: 15px; }

        /* গোপন অ্যাডমিন প্যানেল */
        #admin-panel { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 16, 22, 0.98); z-index: 1000; padding: 50px 20px; box-sizing: border-box; }
        .admin-box { background: var(--card-bg); padding: 30px; border-radius: 20px; border: 1px solid var(--primary); max-width: 400px; margin: 0 auto; text-align: center; }
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; }
        
        .secret-lock { margin-top: 50px; opacity: 0.2; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div id="customer-view">
        <div class="header">
            <img src="logo.png" alt="Logo" class="logo-img">
            <h1 style="font-family: 'Orbitron'; color: var(--primary); font-size: 20px;">VIBE-X STUDIO BD</h1>
        </div>

        <div class="product-card">
            <img src="product.jpg" alt="Aura Edition" class="product-img">
            <h2 style="font-family: 'Orbitron';">AURA EDITION</h2>
            <div class="price">৳ ১২০০</div>
            <a href="https://wa.me/8801830891270?text=Hi, I want to order." class="order-btn">অর্ডার করুন (WhatsApp)</a>
        </div>

        <div class="secret-lock" onclick="openAdmin()">Admin Access 🔒</div>
    </div>

    <div id="admin-panel">
        <div class="admin-box" id="login-form">
            <h3>অ্যাডমিন লগইন</h3>
            <input type="password" id="pass" placeholder="পাসওয়ার্ড দাও">
            <button onclick="checkPass()" style="background: var(--primary); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer;">LOGIN</button>
            <button onclick="closeAdmin()" style="background: #ef4444; border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px;">CANCEL</button>
        </div>

        <div class="admin-box" id="dashboard" style="display: none;">
            <h2 style="color: #22c55e;">হ্যালো মাহিন!</h2>
            <p>এখান থেকে তুমি তোমার সাইট ম্যানেজ করতে পারবে।</p>
            <p>১. নতুন ছবি দিতে GitHub-এ <b>Upload</b> করো।</p>
            <p>২. দাম বদলাতে GitHub-এ <b>index.html</b> এডিট করো।</p>
            <button onclick="closeAdmin()" style="background: var(--primary); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer;">BACK TO SITE</button>
        </div>
    </div>

    <script>
        function openAdmin() { document.getElementById('admin-panel').style.display = 'block'; }
        function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
        
        function checkPass() {
            const p = document.getElementById('pass').value;
            if(p === "vibe26") {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                alert("ভুল পাসওয়ার্ড!");
            }
        }
    </script>
</body>
</html>
